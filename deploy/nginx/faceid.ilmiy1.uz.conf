# faceid.ilmiy1.uz — innoweek frontend (Vite + React SPA)
#
# Serverga o'rnatish:
#   sudo cp faceid.ilmiy1.uz.conf /etc/nginx/sites-available/faceid.ilmiy1.uz
#   sudo ln -s /etc/nginx/sites-available/faceid.ilmiy1.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d faceid.ilmiy1.uz   # HTTPS va 80 -> 443 redirectni o'zi qo'shadi
#
# Loyiha /var/www/faceid.ilmiy1.uz ga joylanadi, `npm run build` dist/ ni yaratadi.

server {
    listen 80;
    listen [::]:80;
    server_name faceid.ilmiy1.uz;

    # Faqat build natijasi ochiq: loyihaning o'zidagi .env, .git, src tashqariga chiqmaydi
    root /var/www/faceid.ilmiy1.uz/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # SPA: BrowserRouter yo'llari (/uz/profile va h.k.) index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keshlanmaydi, aks holda yangi deploy foydalanuvchiga darhol yetib bormaydi
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fayl nomlariga hash qo'shadi, shuning uchun uzoq keshlash xavfsiz
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /video/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # build.sourcemap: true — .map fayllar tashqariga berilmaydi
    location ~* \.map$ {
        return 404;
    }

    # .env, .git kabi yashirin fayllar berilmaydi (certbot uchun .well-known ochiq)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # API proxy kerak emas: VITE_API_BASE_URL=https://olimlar.ilmiy1.uz, brauzer to'g'ridan-to'g'ri
    # backendga boradi (CORS ochiq).

    # PDF sertifikatlar: vite.config.ts dagi /certificate proxy bilan bir xil.
    # X-Frame-Options: SAMEORIGIN ni olib tashlaymiz, aks holda <embed> ichida ochilmaydi.
    # olimlar.ilmiy1.uz shu serverda. Tashqi IP orqali ulansa, tarmoqdagi Kerio Control
    # 403 qaytaradi, shuning uchun 127.0.0.1 orqali ulanamiz (SNI/Host = olimlar.ilmiy1.uz).
    location /certificate/ {
        proxy_pass https://127.0.0.1;
        proxy_set_header Host olimlar.ilmiy1.uz;
        proxy_ssl_server_name on;
        proxy_ssl_name olimlar.ilmiy1.uz;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
