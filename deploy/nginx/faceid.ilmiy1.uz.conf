# faceid.ilmiy1.uz — innoweek frontend (Vite + React SPA)
#
# Serverga o'rnatish:
#   sudo cp faceid.ilmiy1.uz.conf /etc/nginx/sites-available/faceid.ilmiy1.uz
#   sudo ln -s /etc/nginx/sites-available/faceid.ilmiy1.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d faceid.ilmiy1.uz   # HTTPS va 80 -> 443 redirectni o'zi qo'shadi
#
# `npm run build` dan keyin dist/ ichidagi fayllar root papkaga yuklanadi.

server {
    listen 80;
    listen [::]:80;
    server_name faceid.ilmiy1.uz;

    root /var/www/faceid.ilmiy1.uz;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # SPA: BrowserRouter yo'llari (/uz/profile va h.k.) index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keshlanmaydi, aks holda yangi deploy foydalanuvchiga darhol yetib bormaydi
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fayl nomlariga hash qo'shadi, shuning uchun uzoq keshlash xavfsiz
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /video/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # build.sourcemap: true — .map fayllar tashqariga berilmaydi
    location ~* \.map$ {
        return 404;
    }

    # PDF sertifikatlar: vite.config.ts dagi /certificate proxy bilan bir xil.
    # X-Frame-Options: SAMEORIGIN ni olib tashlaymiz, aks holda <embed> ichida ochilmaydi.
    location /certificate/ {
        proxy_pass https://api.innoweek.uz;
        proxy_set_header Host api.innoweek.uz;
        proxy_ssl_server_name on;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
